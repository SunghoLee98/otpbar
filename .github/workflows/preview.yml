name: preview

# 릴리스 전에 받아서 써 볼 수 있는 설치 파일을 만든다.
#
# release.yml 과 달리 태그도, 공개 릴리스도, 업데이트 서명 키도 쓰지 않는다. 결과물은
# 이 실행의 Artifacts 에만 올라가며 14일 뒤 지워진다. 코드 서명을 하지 않으므로
# macOS에서는 처음 열 때 Gatekeeper 경고를 직접 넘겨야 한다.
on:
  push:
    branches: ["claude/**", "preview/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 시험용 빌드 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-apple-silicon
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            name: macos-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            name: windows-x64
            target: x86_64-pc-windows-msvc
            args: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: preview-${{ matrix.target }}

      # 업데이트 서명 키가 없으므로 업데이트용 산출물은 만들지 않는다.
      - name: 앱 빌드
        shell: bash
        run: >
          npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: 설치 파일 올리기
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otpbar-${{ matrix.name }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
